<text x="800.0" y="232.7" text-anchor="start" font-size="11" font-weight="400" fill="#6B7280">Гость видит только просмотр.</text>
<text x="800.0" y="248.7" text-anchor="start" font-size="11" font-weight="400" fill="#6B7280">Кнопка «Сохранить в альбом»</text>
<text x="800.0" y="264.7" text-anchor="start" font-size="11" font-weight="400" fill="#6B7280">ведёт на вход, если нет сессии.</text>
