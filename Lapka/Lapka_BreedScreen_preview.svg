<text x="120.0" y="674.7" text-anchor="start" font-size="11" font-weight="700" fill="#111827">BreedRepositoryImpl</text>
<text x="120.0" y="690.7" text-anchor="start" font-size="11" font-weight="400" fill="#6B7280">сейчас: тестовая порода</text>
<text x="120.0" y="706.7" text-anchor="start" font-size="11" font-weight="400" fill="#6B7280">потом: Retrofit →</text>
<text x="120.0" y="722.7" text-anchor="start" font-size="11" font-weight="400" fill="#6B7280">thedogapi.com / thecatapi.com</text>
<rect x="440" y="635" width="300" height="120" rx="6" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
<text x="450.0" y="682.7" text-anchor="start" font-size="11" font-weight="700" fill="#111827">EncounterRepositoryImpl</text>
<text x="450.0" y="698.7" text-anchor="start" font-size="11" font-weight="400" fill="#6B7280">сейчас: список в памяти</text>
<text x="450.0" y="714.7" text-anchor="start" font-size="11" font-weight="400" fill="#6B7280">потом: Room (таблица encounters)</text>
<rect x="770" y="635" width="320" height="120" rx="6" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5"/>
<text x="780.0" y="682.7" text-anchor="start" font-size="11" font-weight="700" fill="#111827">Результат распознавания</text>
<text x="780.0" y="698.7" text-anchor="start" font-size="11" font-weight="400" fill="#6B7280">приходит с экрана «Распознать»</text>
<text x="780.0" y="714.7" text-anchor="start" font-size="11" font-weight="400" fill="#6B7280">(TFLite живёт в его репозитории)</text>
<rect x="1120" y="635" width="300" height="120" rx="6" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5"/>
<text x="1130.0" y="682.7" text-anchor="start" font-size="11" font-weight="700" fill="#111827">Context · Retrofit · Room · TFLite</text>
<text x="1130.0" y="698.7" text-anchor="start" font-size="11" font-weight="400" fill="#6B7280">только здесь,</text>
<text x="1130.0" y="714.7" text-anchor="start" font-size="11" font-weight="400" fill="#6B7280">никогда не в domain</text>
