<text x="800.0" y="31.0" text-anchor="middle" font-size="19" font-weight="700" fill="#111827">Экран «Карточка породы» — зоны ответственности</text>
<text x="910.0" y="104.0" text-anchor="start" font-size="12" font-weight="400" fill="#6B7280">Entity возвращается обратно тем же путём в UI</text>
<text x="96.0" y="184.3" text-anchor="start" font-size="13" font-weight="700" fill="#111827">presentation</text>
<text x="96.0" y="374.3" text-anchor="start" font-size="13" font-weight="700" fill="#111827">domain — единственный слой, к которому обращается экран</text>
<text x="96.0" y="614.3" text-anchor="start" font-size="13" font-weight="700" fill="#111827">data</text>
<text x="840.0" y="503.7" text-anchor="start" font-size="11" font-weight="400" fill="#111827">интерфейсы, а не реализации — их реализует слой data</text>
