<text x="450.0" y="248.7" text-anchor="start" font-size="11" font-weight="400" fill="#6B7280">принимает клики, вызывает use case,</text>
<text x="450.0" y="264.7" text-anchor="start" font-size="11" font-weight="400" fill="#6B7280">отдаёт состояние экрана</text>
