<text x="120.0" y="248.7" text-anchor="start" font-size="11" font-weight="400" fill="#6B7280">рендер фото, названия,</text>
<text x="120.0" y="264.7" text-anchor="start" font-size="11" font-weight="400" fill="#6B7280">темперамента и ухода</text>
